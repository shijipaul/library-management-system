spring.application.name=library-management-system

#datasource properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:330/library_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#OpenAPI properties
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

#mongodb properties
spring.data.mongodb.uri=mongodb://mongodb:27017/library_mongo

#async properties
async.audit.core-pool-size=5
async.audit.max-ppol-size=10
async.audit.que-capacity=50





